# 依存の更新を PR で受け取る（main 向け）。
# Actions は SHA で固定しているので、更新もここで受ける。
# cooldown: 公開から 7 日たっていない版は提案しない（乗っ取られた版を取り込まないため）。
# セキュリティ更新には cooldown が効かない仕様なので、急ぎの修正は遅れない。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
