# プルリクエストで、サイトがビルドできることを確かめる。
# VitePress はビルドのときにサイト内のリンク切れを検出し、見つかればビルドを失敗させる（ignoreDeadLinks は使わない）。
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run docs:build
