# プルリクエストで、サイトがビルドできることを確かめる。
# VitePress はビルドのときにサイト内のリンク切れを検出し、見つかればビルドを失敗させる（ignoreDeadLinks は使わない）。
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true  # 毎回その時点の最新の 22.x を使う（セキュリティリリースをすぐ取り込む）
          cache: npm
      - run: npm ci
      - run: npm run docs:build
