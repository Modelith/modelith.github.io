# プルリクエストで、サイトがビルドできることと、依存に既知の脆弱性や署名の問題が無いことを確かめる。
# VitePress はビルドのときにサイト内のリンク切れを検出し、見つかればビルドを失敗させる（ignoreDeadLinks は使わない）。
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true  # 毎回その時点の最新の 22.x を使う（セキュリティリリースをすぐ取り込む）
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:build

  # 依存の既知の脆弱性と、配布物の署名・来歴（provenance）を確かめる
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true  # 毎回その時点の最新の 22.x を使う（セキュリティリリースをすぐ取り込む）
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit signatures
      # VitePress 1.6.4 が使う Vite 5・esbuild に、開発用サーバ（docs:dev）だけに効く既知の high / moderate があり、
      # 1.x には修正版が無い。公開するのはビルドした静的ファイルだけなので、ここでは critical だけで止める。
      # VitePress 2 に移ったら --audit-level を moderate に上げる。
      - run: npm audit --audit-level=critical
