# プルリクエストで、サイトがビルドできることを確かめる。
# VitePress はビルドのときにサイト内のリンク切れを検出し、見つかればビルドを失敗させる（ignoreDeadLinks は使わない）。
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true  # 毎回その時点の最新の 22.x を使う（セキュリティリリースをすぐ取り込む）
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:build
